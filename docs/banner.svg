<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="RAPTOR - data-sovereign autonomous SOC triage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8913A"/>
      <stop offset="0.55" stop-color="#f0b866"/>
      <stop offset="1" stop-color="#9E86F0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46B87A"/>
      <stop offset="0.5" stop-color="#E8913A"/>
      <stop offset="1" stop-color="#9E86F0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#E8913A"/>
    </marker>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="238" rx="15" fill="none" stroke="#26303a" stroke-width="1"/>

  <!-- boundary glyph: raw -> token -->
  <g transform="translate(56,74)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="-14" y="-24" width="112" height="92" rx="10" fill="#12261a" stroke="#46B87A" stroke-width="1.5"/>
    <text x="42" y="6" text-anchor="middle" fill="#a9e9c4">WKSTN</text>
    <text x="42" y="26" text-anchor="middle" fill="#a9e9c4">-FIN-01</text>
    <text x="42" y="52" text-anchor="middle" fill="#5b7f6b" font-size="11">raw &#183; on-prem</text>

    <path d="M108 22 L150 22" stroke="#E8913A" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="129" y="14" text-anchor="middle" fill="#E8913A" font-size="10">tokenize</text>

    <rect x="156" y="-24" width="120" height="92" rx="10" fill="#241a33" stroke="#9E86F0" stroke-width="1.5"/>
    <text x="216" y="16" text-anchor="middle" fill="#d4c6f5">[DEVICE-5b24]</text>
    <text x="216" y="52" text-anchor="middle" fill="#8a7bb5" font-size="11">cloud LLM</text>
  </g>

  <!-- wordmark + taglines (widths pinned so they never overflow) -->
  <text x="384" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="url(#wordmark)" textLength="470" lengthAdjust="spacingAndGlyphs">RAPTOR</text>
  <rect x="386" y="120" width="560" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="386" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e6edf3" textLength="540" lengthAdjust="spacingAndGlyphs">Data-sovereign autonomous SOC triage</text>
  <text x="386" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b97a3" textLength="520" lengthAdjust="spacingAndGlyphs">Cloud LLMs on regulated data &#8212; without the leak.</text>
  <text x="386" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#5f6b76" textLength="560" lengthAdjust="spacingAndGlyphs">ReAct agent loop &#183; entity sanitizer &#183; tiered analyst memory</text>
</svg>
